<form action="#" class="flex flex-col gap-md" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
<input class="w-full pl-10 pr-3 py-2 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-sm text-body-sm text-on-surface" id="username" name="username" placeholder="Enter your username" type="text"/>
</div>
</div>

<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>

</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-10 pr-10 py-2 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-sm text-body-sm text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
