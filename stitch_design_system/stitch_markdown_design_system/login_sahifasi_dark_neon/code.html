<style>
        .input-glow:focus {
            box-shadow: 0 0 8px rgba(239, 255, 0, 0.3);
            border-color: #EFFF00;

<body class="bg-pure-black text-on-surface min-h-screen flex items-center justify-center font-body-md relative overflow-hidden">
<!-- Ambient Background Effect -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-variant via-pure-black to-pure-black"></div>
</div>
<!-- System Status Indicator -->
<div class="absolute top-md right-md flex items-center gap-sm bg-surface-dark border border-border-muted px-md py-sm rounded-DEFAULT">
<div class="w-2 h-2 rounded-full bg-neon-yellow animate-pulse"></div>
<span class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">System Status: Optimal</span>
</div>
<!-- Login Container -->
<main class="w-full max-w-md px-container-margin z-10">
<div class="bg-surface-dark border border-border-muted rounded-xl shadow-2xl overflow-hidden p-xl flex flex-col gap-xl">
<!-- Branding Header -->
<div class="flex flex-col items-center gap-md text-center">
<div class="w-24 h-24 rounded-lg overflow-hidden border border-border-muted">
<img alt="Sat-Alfa Logo" class="w-full h-full object-cover grayscale opacity-90" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAIocBGffc23-_jqJOWAj9NXAohlBkU-3-6WS-nxUFsubm5LVTGxpmqDNbW0zRqeWlghf12dAZ4qxrNtNfT9WD06gcH9VnwYAW1fLuv4VHy9sUG3wYYJJkvF3CJlcBLwAvOJBeg_1fuGCpExgDuyc-vna4yjl-xrnRb4biki_9UEeKVovMpgsnlxtnPs158IfSsfhdnpGmGbnmlB2BxaLwkQIfGkIWxcCWfCW5DSQg-d58aQAwxN7InT8I0eNw4mb0qFU8"/>
</div>
<div>
<h1 class="font-headline-lg text-headline-lg text-neon-yellow tracking-tighter">Sat-Alfa</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm">Secure Authentication Portal</p>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-lg mt-md">
<div class="flex flex-col gap-sm">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-wider" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full bg-surface border border-border-muted text-on-surface rounded-DEFAULT py-md pl-12 pr-md font-body-md text-body-md focus:outline-none input-glow transition-all duration-200" id="username" name="username" placeholder="Enter operator ID" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-wider" for="password">Password</label>
<a class="font-label-bold text-label-bold text-neon-yellow hover:underline decoration-2 underline-offset-4 transition-all" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full bg-surface border border-border-muted text-on-surface rounded-DEFAULT py-md pl-12 pr-md font-body-md text-body-md focus:outline-none input-glow transition-all duration-200" id="password" name="password" placeholder="Enter secure key" required="" type="password"/>
</div>
</div>
<button class="mt-md w-full bg-neon-yellow text-pure-black font-label-bold text-label-bold py-md rounded-DEFAULT hover:bg-primary-fixed-dim transition-colors active:scale-[0.98] flex items-center justify-center gap-sm" type="submit">
<span class="uppercase tracking-wider">Sign In</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
</button>
</form>
</div>
<!-- Footer Info -->
<div class="mt-xl text-center">
<p class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider text-xs">
                Restricted Access Area • Unauthorized entry logged
            </p>
</div>
</main>
<!-- Decorative Tech Elements -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-neon-yellow to-transparent opacity-30"></div>
<div class="absolute top-0 right-0 w-64 h-64 border-r border-t border-border-muted opacity-20 pointer-events-none" style="border-radius: 0 100% 0 0;"></div>
<div class="absolute bottom-0 left-0 w-64 h-64 border-l border-b border-border-muted opacity-20 pointer-events-none" style="border-radius: 0 0 0 100%;"></div>
</body></html>
