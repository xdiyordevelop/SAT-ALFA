<!-- Decorative grid lines for 'technical' feel -->
<div class="absolute inset-0 pointer-events-none" style="background-image: linear-gradient(to right, #e5e5e5 1px, transparent 1px), linear-gradient(to bottom, #e5e5e5 1px, transparent 1px); background-size: 24px 24px; opacity: 0.3;"></div>
<div class="relative z-10 flex flex-col items-center mb-xl">
<img alt="Sat-Alfa Logo" class="w-24 h-24 mb-md border-2 border-border-heavy bg-surface-container" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCAJg6_HLtRh0Hfy2Rl-ngRiIysN15jLV0FpBdqxnl6KgFiokd7cE4AZp5Xn5LZ8y5PeHR6JN4L_EIAFygJoGNzmqe154qfLAr_6soZoY52ZAJcsAaE8BewbSQ1RWVMXc2hkOhTzAIssWpzuboQ0QcO4fCnZ4LiVTOXTGp9vE2X0wiWE4457mjKWZ-e-lQ9u2wrL5mk6paz-FJsN4s1gbuDU7qWy6PUSyxOtD34pTmMEkQ2_z213Yw3cT3o2qgF4BuuU3M"/>

<div class="h-px w-full bg-border-heavy mt-md mb-md"></div>
<p class="font-body-md text-body-md text-on-secondary-container">System Access Gateway</p>
</div>
<form class="relative z-10 space-y-lg w-full">
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-on-surface block uppercase" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface">person</span>
<input class="w-full bg-surface border border-border-heavy pl-[40px] pr-sm py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-2 focus:ring-2 focus:ring-neon-yellow focus:ring-offset-2 focus:border-border-heavy transition-all rounded-none" id="username" name="username" placeholder="Enter ID" type="text"/>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-on-surface block uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface">lock</span>
<input class="w-full bg-surface border border-border-heavy pl-[40px] pr-sm py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-2 focus:ring-2 focus:ring-neon-yellow focus:ring-offset-2 focus:border-border-heavy transition-all rounded-none" id="password" name="password" placeholder="Enter Code" type="password"/>
</div>
</div>
<div class="flex justify-end pt-sm">
<a class="font-label-bold text-label-bold text-on-surface hover:text-neon-yellow hover:bg-on-surface transition-colors duration-200 px-xs py-base underline decoration-border-heavy hover:decoration-neon-yellow underline-offset-4" href="#">Forgot Password</a>
</div>
<button class="w-full bg-neon-yellow text-on-surface font-label-bold text-label-bold uppercase py-md border-2 border-border-heavy hover:bg-on-surface hover:text-neon-yellow transition-colors duration-200 flex justify-center items-center gap-sm active:scale-[0.98]" type="submit">
                Sign In
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</form>
<div class="mt-xl text-center relative z-10 border-t border-border-muted pt-md">
<p class="font-label-bold text-[10px] uppercase text-on-secondary-container tracking-widest">Authorized Personnel Only</p>
</div>
